name: Kinjot deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        required: true
        default: setup
        type: choice
        options:
          - setup
          - update
          - backend-only
          - link
          - unlink
          - backfill
          - doctor
          - repair-guide
          - migration-repair
      license_instance_id:
        description: Exact provider instance UUID for recovery adoption after an unresolved link
        required: false
        type: string
      migration_version:
        description: Exact migration version for explicit bookkeeping repair
        required: false
        type: string
      migration_status:
        description: applied or reverted
        required: false
        type: choice
        options:
          - applied
          - reverted
      repair_confirmation:
        description: Exact confirmation requested by the repair guide
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: kinjot-deployment-${{ github.repository }}
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-24.04
    # Setup and a dispatched update walk the release chain (scripts/walk.mjs):
    # no new release starts after 20 minutes of walking, but one started just
    # before that must still finish (a migration push plus bounded function
    # deploys), after tool preparation and, for setup, the first install.
    timeout-minutes: 90
    steps:
      - name: Check out the configuration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Pin Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.1

      - name: Pin pnpm
        uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0 # v6
        with:
          version: 10.15.1

      - name: Prepare pinned operator tools before secrets are exposed
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          tools="$GITHUB_WORKSPACE/.operator-tools"
          mkdir -p "$tools/supabase"
          curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 15 --max-time 420 \
            "https://github.com/supabase/cli/releases/download/v2.118.0/supabase_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/supabase.tar.gz"
          mkdir -p "$RUNNER_TEMP/supabase-extract"
          tar -xzf "$RUNNER_TEMP/supabase.tar.gz" -C "$RUNNER_TEMP/supabase-extract"
          supabase_source="$(dirname "$(find "$RUNNER_TEMP/supabase-extract" -type f -name supabase -print -quit)")"
          test -f "$supabase_source/supabase"
          test -f "$supabase_source/supabase-go"
          cp "$supabase_source/supabase" "$supabase_source/supabase-go" "$tools/supabase/"
          chmod +x "$tools/supabase/supabase" "$tools/supabase/supabase-go"
          "$tools/supabase/supabase" --version | grep -F '2.118.0'
          pnpm install --frozen-lockfile --ignore-scripts
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" --version | grep -F '4.145.0'
          test -x "$(command -v psql)"

      - name: Run read-only doctor
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'doctor'
        shell: bash
        env:
          KINJOT_DATABASE_URL: ${{ secrets.KINJOT_DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          KINJOT_SUPABASE_PROJECT_REF: ${{ vars.KINJOT_SUPABASE_PROJECT_REF }}
          KINJOT_DOCTOR_TIMEOUT_MS: '15000'
        run: |
          set -euo pipefail
          node vendor/scripts/byo-updater/customer-cli.mjs doctor --core

      - name: Run the selected operation
        if: github.event_name == 'schedule' || inputs.operation != 'doctor'
        shell: bash
        env:
          OPERATION: ${{ github.event_name == 'schedule' && 'update' || inputs.operation }}
          EVENT_NAME: ${{ github.event_name }}
          KINJOT_DEPLOYMENT_MODE: ${{ vars.KINJOT_DEPLOYMENT_MODE }}
          MIGRATION_VERSION: ${{ inputs.migration_version }}
          MIGRATION_STATUS: ${{ inputs.migration_status }}
          REPAIR_CONFIRMATION: ${{ inputs.repair_confirmation }}
          LICENSE_INSTANCE_ID: ${{ inputs.license_instance_id }}
          GITHUB_PUSH_TOKEN: ${{ github.token }}
          KINJOT_LICENSE_KEY: ${{ secrets.KINJOT_LICENSE_KEY }}
          KINJOT_DATABASE_URL: ${{ secrets.KINJOT_DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KINJOT_SUPABASE_PROJECT_REF: ${{ vars.KINJOT_SUPABASE_PROJECT_REF }}
          KINJOT_PAGES_PROJECT: ${{ vars.KINJOT_PAGES_PROJECT }}
          KINJOT_PAGES_BRANCH: ${{ vars.KINJOT_PAGES_BRANCH }}
          KINJOT_RELEASE_PIN: ${{ vars.KINJOT_RELEASE_PIN }}
          KINJOT_INSTANCE_NAME: ${{ vars.KINJOT_INSTANCE_NAME }}
          KINJOT_CONFIGURATION_BRANCH: ${{ github.ref_name }}
          KINJOT_UPDATER_STATE: ${{ github.workspace }}/.kinjot/deployment
          KINJOT_TRUST_LIST: ${{ github.workspace }}/trust/production-v1.json
          KINJOT_PSQL_BIN: /usr/bin/psql
          KINJOT_SUPABASE_BIN: ${{ github.workspace }}/.operator-tools/supabase/supabase
          KINJOT_WRANGLER_BIN: ${{ github.workspace }}/node_modules/.bin/wrangler
          KINJOT_UPDATE_TIMEOUT_MS: '600000'
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GITHUB_PUSH_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          unset auth GITHUB_PUSH_TOKEN
          cleanup() { git config --local --unset-all http.https://github.com/.extraheader || true; }
          trap cleanup EXIT
          case "$OPERATION" in
            setup)
              node vendor/scripts/byo-updater/customer-cli.mjs setup
              node scripts/walk.mjs
              ;;
            update)
              # A dispatch walks to the newest release, one release per hop.
              # A scheduled run moves one release, so an unattended run never
              # applies several releases in a row.
              if [[ "$EVENT_NAME" == 'schedule' ]]; then
                node vendor/scripts/byo-updater/customer-cli.mjs update
              else
                node scripts/walk.mjs
              fi
              ;;
            backend-only) node vendor/scripts/byo-updater/customer-cli.mjs update backend-only ;;
            link)
              if [[ -n "$LICENSE_INSTANCE_ID" ]]; then
                node vendor/scripts/byo-updater/customer-cli.mjs link \
                  --adopt-instance "$LICENSE_INSTANCE_ID"
              else
                node vendor/scripts/byo-updater/customer-cli.mjs link
              fi
              ;;
            unlink|backfill|repair-guide)
              node vendor/scripts/byo-updater/customer-cli.mjs "$OPERATION"
              ;;
            migration-repair)
              node vendor/scripts/byo-updater/customer-cli.mjs migration-repair \
                --version "$MIGRATION_VERSION" --status "$MIGRATION_STATUS" \
                --confirm "$REPAIR_CONFIRMATION"
              ;;
            *) echo 'Unsupported operation' >&2; exit 2 ;;
          esac
